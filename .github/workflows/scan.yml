name: 機票價格掃描（每兩週）

on:
  schedule:
    # 每月 1 號與 15 號 UTC 01:10 = 台北時間 09:10（完整掃 60 天，免費額度約每月 2 趟）
    - cron: "10 1 1,15 * *"
  workflow_dispatch:
    inputs:
      routes:
        description: "限定掃描的目的地（逗號分隔，如 SGN,DAD；填 ALL 掃全部）"
        required: false
        default: ""
      max_queries:
        description: "本次最多查幾次（測試用，省額度；留空=完整掃）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: price-scan
  cancel-in-progress: false

jobs:
  # 截止閘門：2026-09 為最後一次掃描，之後排程照樣觸發但整個 scan 工作被跳過
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "$(date -u +%Y%m)" -le "202609" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "已過 2026-09，停止掃描"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取價格
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FORCE_ROUTES: ${{ github.event.inputs.routes }}
          MAX_QUERIES: ${{ github.event.inputs.max_queries }}
        run: python scripts/fetch_prices.py

      - name: 提交資料
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "price scan $(date -u +%F)"
          git push
